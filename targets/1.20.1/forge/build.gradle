plugins {
    id 'net.neoforged.moddev.legacyforge'
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version_common as int)
    withSourcesJar()
}

sourceSets { gameTest { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }

def runClientRequested = gradle.startParameter.taskNames.any { it.endsWith(':runClient') || it == 'runClient' }
def defaultBackendProfile = runClientRequested ? 'legacy-integrated' : 'none'
def backendProfile = providers.gradleProperty('backendProfile').getOrElse(defaultBackendProfile)
def integratedBase = ['cyclopscore', 'commoncapabilities', 'integrateddynamics']
def integratedMin = integratedBase + ['integratedtunnels']
def profiles = [
        none: [],
        dynamics: integratedBase,
        integrated: integratedMin,
        terminals: integratedMin + ['integratedterminals'],
        full: integratedMin + ['integratedterminals', 'integratedcrafting'],
        ae2: ['ae2'],
        rs: ['refinedstorage'],
        toms: ['toms_storage'],
        legacy: ['ae2', 'refinedstorage', 'toms_storage'],
        'legacy-integrated': ['ae2', 'refinedstorage', 'toms_storage'] + integratedMin + ['integratedterminals', 'integratedcrafting'],
        all: ['ae2', 'refinedstorage', 'toms_storage'] + integratedMin + ['integratedterminals', 'integratedcrafting']
]
if (!profiles.containsKey(backendProfile)) {
    throw new GradleException('Unknown backendProfile: ' + backendProfile)
}
ext.backendProfile = backendProfile
ext.profileBackends = profiles[backendProfile]
ext.integratedDependencyLockFile = 'integrated-dependencies.lock.json'
ext.integratedDependencyDirectory = '../../libs/1.20.1/integrated'
ext.integratedDependencyLoader = 'forge'
ext.integratedDependencyLoaderVersion = forge_version
ext.integratedDependencyJava = java_version_common
apply from: rootProject.file('../../gradle/verify-integrated-dependencies.gradle')

def integratedLock = new groovy.json.JsonSlurper().parse(rootProject.file('integrated-dependencies.lock.json'))
def integratedPaths = integratedLock.dependencies.collectEntries { dep ->
    [(dep.id): rootProject.file('../../libs/1.20.1/integrated/' + dep.file)]
}
// ModDevGradle remaps these production Forge jars from SRG to official mappings.
// Their locked local copies remain the compile-time API and checksum audit source.
def integratedModules = [
        cyclopscore: [project: 232758, file: 9607385],
        commoncapabilities: [project: 247007, file: 7229322],
        integrateddynamics: [project: 236307, file: 9385153],
        integratedtunnels: [project: 251389, file: 7076217],
        integratedterminals: [project: 295910, file: 8726024],
        integratedcrafting: [project: 287357, file: 9383621]
]
def profileIntegratedModules = profiles[backendProfile].findAll { integratedModules.containsKey(it) }
def profileClientFiles = ['sophisticated-core-e0UoBJSs.jar', 'sophisticated-backpacks-X7q2xTaV.jar',
                          "jei-${minecraft_version}-forge-${jei_version}.jar"]
if ('ae2' in profiles[backendProfile]) profileClientFiles += ['ae2-jYgSnxye.jar', 'guideme-20.1.7.jar']
if ('refinedstorage' in profiles[backendProfile]) profileClientFiles += ['refined-storage-ZITLFjjf.jar']
if ('toms_storage' in profiles[backendProfile]) profileClientFiles += ['toms-storage-XELeoPjZ.jar']

legacyForge {
    version = "${forge_minecraft_version}-${forge_version}"
    addModdingDependenciesTo(sourceSets.gameTest)
    validateAccessTransformers = true

    runs {
        client {
            client()
            gameDirectory = project.file('../../../runs/1.20.1/forge-client')
        }
        server {
            server()
            gameDirectory = project.file('../../../runs/1.20.1/forge-server-' + backendProfile)
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            programArgument '--mixin.config'
            programArgument 'digitalstorage_tests.mixins.json'
            gameDirectory = project.file('../../../runs/1.20.1/forge-gametest-' + backendProfile)
            systemProperty 'forge.enabledGameTestNamespaces', mod_id + ',digitalstorage_tests'
            systemProperty 'digitalstorage.backendProfile', backendProfile
            systemProperty 'digitalstorage.expectedBackends', profiles[backendProfile].findAll { it in ['ae2', 'refinedstorage', 'toms_storage', 'integrateddynamics'] }.join(',')
            systemProperty 'digitalstorage.testReport', layout.buildDirectory.file('reports/integration/' + backendProfile + '/gametest.xml').get().asFile.absolutePath
        }
    }

    mods {
        digitalstorage_tests { sourceSet sourceSets.gameTest }
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modCompileOnly 'maven.modrinth:sophisticated-core:e0UoBJSs'
    modCompileOnly 'maven.modrinth:sophisticated-backpacks:X7q2xTaV'
    modCompileOnly 'maven.modrinth:ae2:jYgSnxye'
    modCompileOnly 'maven.modrinth:refined-storage:ZITLFjjf'
    modCompileOnly 'maven.modrinth:toms-storage:XELeoPjZ'
    modRuntimeOnly 'maven.modrinth:sophisticated-core:e0UoBJSs'
    modRuntimeOnly 'maven.modrinth:sophisticated-backpacks:X7q2xTaV'
    // The selected profile applies to clients, dedicated servers and tests.
    if (runClientRequested || !profiles[backendProfile].isEmpty()) {
        if (runClientRequested) modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
        if ('ae2' in profiles[backendProfile]) {
            modRuntimeOnly 'maven.modrinth:ae2:jYgSnxye'
            modRuntimeOnly 'org.appliedenergistics:guideme:20.1.7'
        }
        if ('refinedstorage' in profiles[backendProfile]) modRuntimeOnly 'maven.modrinth:refined-storage:ZITLFjjf'
        if ('toms_storage' in profiles[backendProfile]) modRuntimeOnly 'maven.modrinth:toms-storage:XELeoPjZ'
        profileIntegratedModules.each { id ->
            def artifact = integratedModules[id]
            modRuntimeOnly "curse.maven:${id}-${artifact.project}:${artifact.file}"
        }
    }
    // Compile against the exact Forge artifacts in the target lock, but never package them in this mod.
    compileOnly files(integratedPaths.values())
    compileOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    modCompileOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    modRuntimeOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    // PickupContextMixin needs MixinExtras in production, including minimal packs.
    jarJar('io.github.llamalad7:mixinextras-forge') {
        version {
            strictly '[0.4.1,)'
            prefer '0.4.1'
        }
        transitive = false
    }
    compileOnly 'org.appliedenergistics:guideme:20.1.7:api'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Minecraft 1.20.1's Log4j SLF4J bridge requires the SLF4J 2 API, while
    // Gradle's own runtime may otherwise expose an older 1.x API to JUnit.
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.9'
    // The 1.20.1 test matrix runs inside Forge GameTest; these assertions are
    // called by the GameTest driver, not by JUnit's untransformed JVM runner.
    compileOnly 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    compileOnly 'org.junit.jupiter:junit-jupiter-params:5.11.4'
    runtimeOnly 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    runtimeOnly 'org.junit.jupiter:junit-jupiter-params:5.11.4'
    gameTestServerAdditionalRuntimeClasspath 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    gameTestServerAdditionalRuntimeClasspath 'org.junit.jupiter:junit-jupiter-params:5.11.4'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Install audited Forge mods into the run's actual `mods` directory. ModDev's
// additional runtime classpath makes jars visible to Java but does not install
// them as Forge mods, which is required for in-game integration testing.
tasks.register('prepareForgeClientMods', Copy) {
    from({ sourceSets.main.runtimeClasspath.filter { it.name in profileClientFiles } })
    into('../../../runs/1.20.1/forge-client/mods')
    doFirst {
        delete(files('../../../runs/1.20.1/forge-client/mods/sophisticatedcore-1.20.1-1.5.10.2402.jar',
                '../../../runs/1.20.1/forge-client/mods/sophisticatedbackpacks-1.20.1-3.26.12.2206.jar',
                '../../../runs/1.20.1/forge-client/mods/appliedenergistics2-forge-15.4.11.jar',
                '../../../runs/1.20.1/forge-client/mods/refinedstorage-1.12.4.jar',
                '../../../runs/1.20.1/forge-client/mods/toms_storage-1.20-1.7.1.jar',
                '../../../runs/1.20.1/forge-client/mods/ae2-jYgSnxye.jar',
                '../../../runs/1.20.1/forge-client/mods/refined-storage-ZITLFjjf.jar',
                '../../../runs/1.20.1/forge-client/mods/toms-storage-XELeoPjZ.jar',
                '../../../runs/1.20.1/forge-client/mods/CyclopsCore-1.20.1-1.22.5.jar',
                '../../../runs/1.20.1/forge-client/mods/CommonCapabilities-1.20.1-2.9.11.jar',
                '../../../runs/1.20.1/forge-client/mods/IntegratedDynamics-1.20.1-1.31.4.jar',
                '../../../runs/1.20.1/forge-client/mods/IntegratedTunnels-1.20.1-1.9.0.jar',
                '../../../runs/1.20.1/forge-client/mods/IntegratedTerminals-1.20.1-1.7.0.jar',
                '../../../runs/1.20.1/forge-client/mods/IntegratedCrafting-1.20.1-1.4.10.jar'))
    }
}

tasks.register('prepareForgeGameTestMods', Sync) {
    from({ sourceSets.main.runtimeClasspath.filter { it.name in profileClientFiles && !it.name.startsWith('jei-') } })
    into('../../../runs/1.20.1/forge-gametest-' + backendProfile + '/mods')
}
tasks.register('prepareForgeServerMods', Sync) {
    from({ sourceSets.main.runtimeClasspath.filter { it.name in profileClientFiles && !it.name.startsWith('jei-') } })
    into('../../../runs/1.20.1/forge-server-' + backendProfile + '/mods')
}
tasks.named('runServer') { dependsOn 'prepareForgeServerMods' }

tasks.named('runClient') {
    dependsOn(tasks.named('prepareForgeClientMods'))
}

tasks.named('runGameTestServer') {
    dependsOn(tasks.named('prepareForgeGameTestMods'))
}

sourceSets.main.java.srcDir('../../../common/src/main/java')
sourceSets.main.java.srcDir('src/test/java')
sourceSets.test.java.include '**/StorageOperationTest.java'
def sharedResources = tasks.register('prepareSharedForgeResources', Sync) {
    from('../../../shared/src/main/resources')
    from('../../1.21.1/neoforge/src/main/resources') {
        exclude('META-INF/neoforge.mods.toml', 'META-INF/accesstransformer.cfg', 'pack.mcmeta', "${mod_id}.mixins.json")
        // SCC has no Forge 1.20.1 release, so its backpack variant does not exist on this target.
        exclude('data/*/recipe/backpack_variant_scc.json')
        eachFile { details ->
            if (details.path.contains('/tags/item/')) {
                details.path = details.path.replace('/tags/item/', '/tags/items/')
            }
            details.path = details.path.replace('/recipe/', '/recipes/').replace('/advancement/', '/advancements/')
        }
    }
    into(layout.buildDirectory.dir('generated/sharedResources'))
    doLast {
        // Keep the Integrated Dynamics model overrides, translations and backpack recipe on Forge.
        def recipes = fileTree(destinationDir).matching { include('data/**/recipes/*.json') }
        recipes.each { recipeFile ->
            def recipe = new groovy.json.JsonSlurper().parse(recipeFile)
            def changed = false
            if (recipe.result instanceof Map && recipe.result.containsKey('id')) {
                recipe.result.item = recipe.result.remove('id')
                changed = true
            }
            // Data conditions differ per loader: NeoForge's `neoforge:conditions` is Forge 1.20.1's `conditions`.
            if (recipe.containsKey('neoforge:conditions')) {
                recipe['conditions'] = recipe.remove('neoforge:conditions').collect { condition ->
                    condition.type = condition.type.replace('neoforge:', 'forge:')
                    condition
                }
                changed = true
            }
            // Tom's Simple Storage 1.20 prefixes its item IDs with `ts.`.
            if (recipe.ingredient instanceof String && recipe.ingredient == 'toms_storage:inventory_connector') {
                recipe.ingredient = 'toms_storage:ts.inventory_connector'
                changed = true
            } else if (recipe.ingredient instanceof Map && recipe.ingredient.item == 'toms_storage:inventory_connector') {
                recipe.ingredient.item = 'toms_storage:ts.inventory_connector'
                changed = true
            }
            if (changed) {
                recipeFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(recipe)) + '\n'
            }
        }
    }
}
sourceSets.main.resources.srcDir(sharedResources)

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.withType(JavaCompile).configureEach {
    dependsOn 'verifyIntegratedDependencies'
    options.encoding = 'UTF-8'
    options.release = java_version_common as int
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
tasks.named('compileTestJava', JavaCompile).configure {
    doFirst { delete destinationDirectory }
}

// ModDevGradle adds the remapped Minecraft/Forge classes directly to main
// compilation tasks. Plain Gradle JUnit tasks do not inherit that classpath,
// so mirror it for the Forge-side tests that exercise Minecraft APIs.
tasks.named('compileTestJava', JavaCompile).configure {
    classpath += tasks.named('compileJava', JavaCompile).get().classpath
}
tasks.named('test', Test).configure {
    classpath += tasks.named('compileJava', JavaCompile).get().classpath
}

tasks.named('jar', Jar).configure {
    // JUnit fixtures and the Forge GameTest driver are compiled into the mod
    // output so the dev server can discover them, but are excluded from jars.
    exclude '**/*Test.class'
    exclude '**/*Tests.class'
    exclude '**/*Test$*.class'
    exclude '**/*Tests$*.class'
    exclude "data/${mod_id}/structures/empty.nbt"
}

processResources {
    dependsOn(sharedResources)
    def obsoleteRecipeDir = layout.buildDirectory.dir("resources/main/data/${mod_id}/recipe")
    outputs.upToDateWhen { fileTree(obsoleteRecipeDir).matching { include '**/*.json' }.isEmpty() }
    doFirst {
        delete(obsoleteRecipeDir)
    }
    def properties = [
        version: "${mod_version}+${forge_minecraft_version}",
        mod_id: mod_id,
        mod_name: mod_name,
        mod_description: mod_description,
        mod_authors: mod_authors,
        mod_license: mod_license,
        forge_minecraft_version_range: '[1.20.1,1.20.2)',
        forge_version_range: '[47,)',
        forge_loader_version_range: forge_loader_version_range,
        jei_version: jei_version
    ]
    inputs.properties(properties)
    filesMatching('META-INF/mods.toml') {
        expand(properties)
    }
    filesMatching('pack.mcmeta') {
        expand(properties)
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes(['MixinConfigs': "${mod_id}.mixins.json"])
}

tasks.register('verifyForgeResources') {
    group = 'verification'
    description = 'Checks the 1.20.1 recipe result format and generated pack metadata.'
    dependsOn(tasks.named('processResources'))
    doLast {
        def resources = layout.buildDirectory.dir('resources/main').get().asFile
        def recipeDir = new File(resources, "data/${mod_id}/recipes")
        ['remote_deposit_upgrade', 'remote_restock_upgrade', 'remote_pickup_upgrade',
         'remote_magnet_upgrade', 'remote_refill_upgrade', 'remote_feeding_upgrade',
         'remote_alchemy_upgrade', 'remote_pump_upgrade', 'remote_crafting_upgrade'].each { recipeName ->
            def recipeFile = new File(recipeDir, "${recipeName}.json")
            if (!recipeFile.isFile()) {
                throw new GradleException("Missing Forge recipe: ${recipeFile}")
            }
            def recipe = new groovy.json.JsonSlurper().parse(recipeFile)
            if (!(recipe.result instanceof Map) || !recipe.result.item || recipe.result.id) {
                throw new GradleException("Recipe ${recipeName} does not use the Forge 1.20 result format")
            }
        }
        if (new File(recipeDir, 'backpack_variant_scc.json').exists()) {
            throw new GradleException('SCC has no Forge 1.20.1 release: its backpack variant must not be packaged')
        }
        if (!new File(recipeDir, 'unlink_upgrade.json').isFile()) {
            throw new GradleException('Missing Forge unlink recipe')
        }
        ['ae2': 'ae2', 'rs': 'refinedstorage', 'toms': 'toms_storage', 'id': 'integrateddynamics'].each { variant, modId ->
            def variantFile = new File(recipeDir, "backpack_variant_${variant}.json")
            if (!variantFile.isFile()) {
                throw new GradleException("Missing Forge backpack variant recipe: ${variantFile}")
            }
            def recipe = new groovy.json.JsonSlurper().parse(variantFile)
            def condition = recipe['conditions']?.getAt(0)
            if (variant == 'toms' && recipe.ingredient?.item != 'toms_storage:ts.inventory_connector') {
                throw new GradleException("Tom's variant must use the 1.20 item ID ts.inventory_connector")
            }
            if (variant == 'id' && recipe.ingredient?.item != 'integrateddynamics:crystalized_menril_chunk') {
                throw new GradleException('Integrated Dynamics variant must use crystalized_menril_chunk')
            }
            if (recipe.containsKey('neoforge:conditions') || condition?.type != 'forge:mod_loaded' || condition?.modid != modId) {
                throw new GradleException("Backpack variant ${variant} must be conditional on ${modId} with Forge `conditions`")
            }
        }
        if (!fileTree(new File(resources, "data/${mod_id}/recipe")).matching { include '**/*.json' }.isEmpty()) {
            throw new GradleException('Forge 1.20.1 recipes must use recipes/')
        }
        def pack = new groovy.json.JsonSlurper().parse(new File(resources, 'pack.mcmeta'))
        if (pack.pack.pack_format != 15) {
            throw new GradleException('Forge 1.20.1 pack.mcmeta must use pack_format 15')
        }
        if (!new File(resources, "${mod_id}.mixins.json").isFile()) {
            throw new GradleException('Forge Mixin configuration is missing')
        }
        def upgradeTag = new File(resources, 'data/sophisticatedbackpacks/tags/items/upgrade.json')
        if (!upgradeTag.isFile() || new File(resources, 'data/sophisticatedbackpacks/tags/item/upgrade.json').exists()) {
            throw new GradleException('Forge 1.20.1 upgrade tag must use tags/items')
        }
        def mixins = new groovy.json.JsonSlurper().parse(new File(resources, "${mod_id}.mixins.json"))
        ['PickupContextMixin', 'MagnetUpgradeWrapperAccessor', 'ItemEntityPickupDelayAccessor',
         'BackpackFluidCapabilityMixin',
         'AlchemyDefinitionsAccessor',
         'client.BackpackBakedModelMixin', 'client.BackpackItemOverrideListMixin'].each { mixin ->
            if (!(mixins.mixins + (mixins.client ?: [])).contains(mixin)) throw new GradleException("Required Forge Mixin is missing: ${mixin}")
        }
    }
}

tasks.named('check') {
    dependsOn(tasks.named('verifyForgeResources'))
    dependsOn(tasks.named('runGameTestServer'))
}

apply from: rootProject.file('../../gradle/verify-forge-production-jar.gradle')


version = "${mod_version}+${minecraft_version}-forge"

legacyForge.runs.configureEach { run ->
    run.loadedMods = run.name == 'gameTestServer' ? [legacyForge.mods[mod_id], legacyForge.mods.digitalstorage_tests] : [legacyForge.mods[mod_id]]
}
tasks.named('runGameTestServer') {
    def report = layout.buildDirectory.file('reports/integration/' + backendProfile + '/gametest.xml')
    doFirst { report.get().asFile.parentFile.mkdirs(); report.get().asFile.delete() }
    doLast {
        def xml = javax.xml.parsers.DocumentBuilderFactory.newInstance().newDocumentBuilder().parse(report.get().asFile)
        def cases = xml.getElementsByTagName('testcase')
        def names = (0..<cases.length).collect { cases.item(it).getAttribute('name').toLowerCase() }
        def required = ['profile']
        if ('integratedtunnels' in profileBackends) required += ['topology', 'binding', 'unavailable', 'items', 'channelsandlongcounts', 'nativefilters', 'fluidsandcachedguard', 'nativeinterceptors', 'cachedbackpackguard', 'serviceconservation', 'restockbatches', 'selectivequeries', 'positionfailurecleanup', 'feedingcontainerfallback', 'omnimembership']
        if (xml.getElementsByTagName('failure').length || xml.getElementsByTagName('error').length || xml.getElementsByTagName('skipped').length
                || names.size() != names.toSet().size() || required.any { name -> names.count { it == name } != 1 }
                || names.size() != 16 + required.size()) throw new GradleException('Incomplete Forge GameTest report: ' + names)
    }
}
