plugins {
    id 'net.neoforged.moddev'
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

group = mod_group_id
version = "${mod_version}+${minecraft_version}-neoforge"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

sourceSets { gameTest { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }

neoForge {
    version = neoforge_version
    addModdingDependenciesTo(sourceSets.gameTest)
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = project.file('../../../runs/1.21.1/client')
            programArgument '--quickPlaySingleplayer'
            programArgument 'New World'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('../../../runs/1.21.1/gametest-' + providers.gradleProperty('backendProfile').getOrElse('legacy'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'digitalstorage_tests'
            systemProperty 'digitalstorage.backendProfile', providers.gradleProperty('backendProfile').getOrElse('legacy')
            systemProperty 'digitalstorage.testReport', layout.buildDirectory.file('reports/integration/' + providers.gradleProperty('backendProfile').getOrElse('legacy') + '/gametest.xml').get().asFile.absolutePath
        }
        server {
            server()
            gameDirectory = project.file('../../../runs/1.21.1/server')
            programArgument '--nogui'
        }
    }

    mods {
        digitalstorage_tests { sourceSet sourceSets.gameTest }
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods[mod_id]
        loadedMods = [mods[mod_id]]
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

apply from: rootProject.file('../../gradle/verify-integrated-dependencies.gradle')

def profile = providers.gradleProperty('backendProfile').getOrElse('legacy')
def integratedBase = ['cyclopscore', 'commoncapabilities', 'integrateddynamics']
def integratedMin = integratedBase + ['integratedtunnels']
def profiles = [none: [], dynamics: integratedBase, integrated: integratedMin,
    terminals: integratedMin + ['integratedterminals'],
    full: integratedMin + ['integratedterminals', 'integratedcrafting'],
    ae2: ['ae2'], rs: ['refinedstorage'], toms: ['toms_storage'], scc: ['scc'],
    all: ['ae2', 'refinedstorage', 'toms_storage', 'scc'] + integratedMin + ['integratedterminals', 'integratedcrafting'],
    legacy: ['ae2', 'refinedstorage', 'toms_storage', 'scc']]
if (!profiles.containsKey(profile)) throw new GradleException('Unknown backendProfile: ' + profile)
if (providers.gradleProperty('sccTests').isPresent() && providers.gradleProperty('backendProfile').isPresent()) {
    throw new GradleException('Use either -PsccTests or -PbackendProfile, not both')
}
ext.backendProfile = profile
ext.profileBackends = profiles[profile]
def integratedLock = new groovy.json.JsonSlurper().parse(rootProject.file('integrated-dependencies.lock.json'))
def integratedPaths = integratedLock.dependencies.collectEntries { dep ->
    [(dep.id): rootProject.file('../../libs/1.21.1/integrated/' + dep.file)]
}
def backends = [ae2: 'maven.modrinth:ae2:KDnFUmMm', refinedstorage: 'maven.modrinth:refined-storage:lHHiI26k',
    toms_storage: 'maven.modrinth:toms-storage:WQAMoIMC', scc: files('../../../libs/scc-1.5.3.jar')]

dependencies {
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.64.0.455'
    localRuntime 'mezz.jei:jei-1.21.1-neoforge:19.64.0.455'
    compileOnly 'io.github.llamalad7:mixinextras-neoforge:0.5.3'
    localRuntime 'io.github.llamalad7:mixinextras-neoforge:0.5.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    ['maven.modrinth:nmoqTijg:PXl6rB3q', 'maven.modrinth:TyCTlI4b:AhPnzNtJ'].each {
        compileOnly it
        testImplementation it
        localRuntime it
    }
    backends.each { id, dependency ->
        compileOnly dependency
        testCompileOnly dependency
        if (id in profiles[profile]) localRuntime dependency
        if (profile != 'legacy' && id in profiles[profile]) testRuntimeOnly dependency
    }
    if (providers.gradleProperty('sccTests').isPresent()) testRuntimeOnly backends.scc
    compileOnly 'org.appliedenergistics:guideme:21.1.1:api'
    if ('ae2' in profiles[profile]) localRuntime 'org.appliedenergistics:guideme:21.1.1'
    if (profile != 'legacy' && 'ae2' in profiles[profile]) testRuntimeOnly 'org.appliedenergistics:guideme:21.1.1'
    compileOnly files(integratedPaths.values())
    testCompileOnly files(integratedPaths.values())
    localRuntime files(profiles[profile].findAll { integratedPaths.containsKey(it) }.collect { integratedPaths[it] })
    testRuntimeOnly files(profiles[profile].findAll { integratedPaths.containsKey(it) }.collect { integratedPaths[it] })
}

tasks.withType(JavaCompile).configureEach { dependsOn 'verifyIntegratedDependencies' }

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'digitalstorage.backendProfile', profile
    if (profile != 'legacy') {
        reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/' + profile)
        reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/' + profile)
    }
    if (providers.gradleProperty('sccTests').isPresent()) {
        reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/scc-contract')
        reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/scc-contract')
        maxHeapSize = '2G'
        include '**/SccNativeContractTest*', '**/SccAccessPolicyTest*'
    } else {
        if (!(profile in ['scc', 'all'])) exclude '**/SccNativeContractTest*'
    }
}

processResources {
    def properties = [
        version: "${mod_version}+${minecraft_version}",
        mod_id: mod_id,
        mod_name: mod_name,
        mod_description: mod_description,
        mod_authors: mod_authors,
        mod_license: mod_license,
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version,
        neoforge_loader_version_range: neoforge_loader_version_range
    ]
    inputs.properties(properties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(properties)
    }
    filesMatching('pack.mcmeta') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

sourceSets.main.java.srcDir('../../../common/src/main/java')

tasks.register('verifySccJar') {
    inputs.file('../../../libs/scc-1.5.3.jar')
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        file('../../../libs/scc-1.5.3.jar').withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int length
            while ((length = stream.read(buffer)) != -1) digest.update(buffer, 0, length)
        }
        if (digest.digest().encodeHex().toString() != 'e81ed8d3fdab7ce9bc35efc58036b63dcb6baefd07613156599dd638f8e84d3c') {
            throw new GradleException('SCC JAR differs from audited 1.5.3 artifact')
        }
    }
}
tasks.named('compileJava') { dependsOn('verifySccJar') }

sourceSets.main.resources.srcDir('../../../shared/src/main/resources')

neoForge.runs.configureEach { run ->
    run.loadedMods = run.name == 'gameTestServer' ? [neoForge.mods[mod_id], neoForge.mods.digitalstorage_tests] : [neoForge.mods[mod_id]]
}
apply from: rootProject.file('../../gradle/integrated-gametest-gate.gradle')
if (profile != 'legacy') tasks.named('check') { dependsOn 'runGameTestServer' }
