plugins {
    id 'net.neoforged.moddev'
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

group = mod_group_id
version = "${mod_version}+${minecraft_version}-neoforge"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

neoForge {
    version = neoforge_version
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = project.file('../../../runs/1.21.1/client')
            programArgument '--quickPlaySingleplayer'
            programArgument 'New World'
        }
        server {
            server()
            gameDirectory = project.file('../../../runs/1.21.1/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods[mod_id]
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.64.0.455'
    localRuntime 'mezz.jei:jei-1.21.1-neoforge:19.64.0.455'
    compileOnly files('../../../libs/scc-1.5.3.jar')
    testCompileOnly files('../../../libs/scc-1.5.3.jar')
    if (providers.gradleProperty('sccTests').isPresent()) testRuntimeOnly files('../../../libs/scc-1.5.3.jar')
    localRuntime files('../../../libs/scc-1.5.3.jar')
    compileOnly 'io.github.llamalad7:mixinextras-neoforge:0.5.3'
    localRuntime 'io.github.llamalad7:mixinextras-neoforge:0.5.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'maven.modrinth:nmoqTijg:PXl6rB3q'
    testImplementation 'maven.modrinth:TyCTlI4b:AhPnzNtJ'
    compileOnly 'maven.modrinth:nmoqTijg:PXl6rB3q'
    compileOnly 'maven.modrinth:TyCTlI4b:AhPnzNtJ'
    compileOnly 'maven.modrinth:ae2:KDnFUmMm'
    compileOnly 'maven.modrinth:refined-storage:lHHiI26k'
    compileOnly 'maven.modrinth:toms-storage:WQAMoIMC'
    compileOnly 'org.appliedenergistics:guideme:21.1.1:api'
    localRuntime 'maven.modrinth:nmoqTijg:PXl6rB3q'
    localRuntime 'maven.modrinth:TyCTlI4b:AhPnzNtJ'
    localRuntime 'maven.modrinth:ae2:KDnFUmMm'
    localRuntime 'maven.modrinth:refined-storage:lHHiI26k'
    localRuntime 'maven.modrinth:toms-storage:WQAMoIMC'
    localRuntime 'org.appliedenergistics:guideme:21.1.1'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    if (providers.gradleProperty('sccTests').isPresent()) {
        reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/scc-contract')
        reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/scc-contract')
        maxHeapSize = '2G'
        include '**/SccNativeContractTest*', '**/SccAccessPolicyTest*'
    } else {
        exclude '**/SccNativeContractTest*'
    }
}

processResources {
    def properties = [
        version: "${mod_version}+${minecraft_version}",
        mod_id: mod_id,
        mod_name: mod_name,
        mod_description: mod_description,
        mod_authors: mod_authors,
        mod_license: mod_license,
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version,
        neoforge_loader_version_range: neoforge_loader_version_range
    ]
    inputs.properties(properties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(properties)
    }
    filesMatching('pack.mcmeta') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

sourceSets.main.java.srcDir('../../../common/src/main/java')

tasks.register('verifySccJar') {
    inputs.file('../../../libs/scc-1.5.3.jar')
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        file('../../../libs/scc-1.5.3.jar').withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int length
            while ((length = stream.read(buffer)) != -1) digest.update(buffer, 0, length)
        }
        if (digest.digest().encodeHex().toString() != 'e81ed8d3fdab7ce9bc35efc58036b63dcb6baefd07613156599dd638f8e84d3c') {
            throw new GradleException('SCC JAR differs from audited 1.5.3 artifact')
        }
    }
}
tasks.named('compileJava') { dependsOn('verifySccJar') }

sourceSets.main.resources.srcDir('../../../shared/src/main/resources')
