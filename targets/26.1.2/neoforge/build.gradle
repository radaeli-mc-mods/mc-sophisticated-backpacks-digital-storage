plugins {
    id 'net.neoforged.moddev'
}

repositories {
 maven { url = 'https://maven.blamejared.com' }
}

group = mod_group_id
version = "${mod_version}+${minecraft_version}-neoforge"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

sourceSets { gameTest { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }
sourceSets { junitSupport { compileClasspath += sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.runtimeClasspath } }

neoForge {
    version = neoforge_version
    addModdingDependenciesTo(sourceSets.gameTest)
    addModdingDependenciesTo(sourceSets.junitSupport)
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = project.file('../../../runs/26.1.2/client' + (providers.gradleProperty('backendProfile').getOrElse('none') == 'all' ? '' : '-' + providers.gradleProperty('backendProfile').getOrElse('none')))
            programArgument '--quickPlaySingleplayer'
            programArgument 'New World'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('../../../runs/26.1.2/gametest-' + providers.gradleProperty('backendProfile').getOrElse('none'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'digitalstorage_tests'
            systemProperty 'digitalstorage.backendProfile', providers.gradleProperty('backendProfile').getOrElse('none')
            programArgument '--report'
            programArgument layout.buildDirectory.file('reports/integration/' + providers.gradleProperty('backendProfile').getOrElse('none') + '/gametest.xml').get().asFile.absolutePath
        }
        server {
            server()
            gameDirectory = project.file('../../../runs/26.1.2/server' + (providers.gradleProperty('backendProfile').getOrElse('none') == 'all' ? '' : '-' + providers.gradleProperty('backendProfile').getOrElse('none')))
            programArgument '--nogui'
        }
    }

    mods {
        digitalstorage_junit { sourceSet sourceSets.junitSupport }
        digitalstorage_tests { sourceSet sourceSets.gameTest }
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods[mod_id]
        loadedMods = [mods[mod_id], mods.digitalstorage_junit]
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

apply from: rootProject.file('../../gradle/audited-dependencies.gradle')

dependencies {
 compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
 localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
 compileOnly 'io.github.llamalad7:mixinextras-neoforge:0.5.3'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testImplementation 'net.neoforged:testframework:26.1.2.124'
 junitSupportCompileOnly 'net.neoforged:testframework:26.1.2.124'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'digitalstorage.backendProfile', backendProfile
    outputs.dir(layout.buildDirectory.dir('reports/tests/' + backendProfile))
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/' + backendProfile)
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/' + backendProfile)
    maxHeapSize = '2G'
    if (!(backendProfile in ['scc','all'])) exclude '**/SccNativeContractTest*'
}

processResources {
    def properties = [
        version: "${mod_version}+${minecraft_version}",
        mod_id: mod_id,
        mod_name: mod_name,
        mod_description: mod_description,
        mod_authors: mod_authors,
        mod_license: mod_license,
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version,
        jei_version: jei_version,
        neoforge_loader_version_range: neoforge_loader_version_range
    ]
    inputs.properties(properties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(properties)
    }
    filesMatching('pack.mcmeta') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

sourceSets.main.java.srcDir('../../../common/src/main/java')


tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '1000'] }

neoForge.runs.configureEach { run ->
 run.loadedMods = (run.name == 'gameTestServer' || run.name.startsWith('restart')) ? [neoForge.mods[mod_id], neoForge.mods.digitalstorage_tests] : [neoForge.mods[mod_id]]
}

['prepare', 'verify'].each { phase ->
 neoForge.runs.create('restart' + phase.capitalize()) {
  type = 'gameTestServer'
  sourceSet = sourceSets.gameTest
  gameDirectory = project.file('../../../runs/26.1.2/restart')
  systemProperty 'neoforge.enabledGameTestNamespaces', 'digitalstorage_tests'
  systemProperty 'digitalstorage.backendProfile', 'all'
  systemProperty 'digitalstorage.restartPhase', phase
  programArgument '--report'
  programArgument layout.buildDirectory.file('reports/restart/' + phase + '/gametest.xml').get().asFile.absolutePath
 }
}

tasks.named('check') { dependsOn 'runGameTestServer' }
if (backendProfile == 'all') tasks.named('check') { dependsOn 'runRestartVerify' }

tasks.named('test', Test) {
 afterSuite { descriptor, result ->
  if (descriptor.parent == null && (result.testCount == 0 || result.skippedTestCount != 0)) {
   throw new GradleException('The mandatory JUnit profile ran no tests or skipped tests')
  }
 }
}

def validateNativeReport = { File report ->
 if (!report.isFile()) throw new GradleException('Missing native GameTest XML report: ' + report)
 def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
 factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
 def document = factory.newDocumentBuilder().parse(report)
 def cases = document.getElementsByTagName('testcase')
 def names = (0..<cases.length).collect { cases.item(it).getAttribute('name') }.findAll { it.startsWith('digitalstorage_tests:') }
 if (names.size() != names.toSet().size()
     || document.getElementsByTagName('failure').length != 0 || document.getElementsByTagName('error').length != 0 || document.getElementsByTagName('skipped').length != 0) {
  throw new GradleException('Failed or duplicate GameTest report: ' + names + ' in ' + report)
 }
 def backends = backendProfile == 'all' ? ['ae2', 'refinedstorage', 'toms_storage', 'scc', 'integrateddynamics'] :
     backendProfile in ['integrated', 'terminals', 'full'] ? ['integrateddynamics'] :
     backendProfile in ['none', 'dynamics'] ? [] : [backendProfile == 'rs' ? 'refinedstorage' : backendProfile == 'toms' ? 'toms_storage' : backendProfile]
 def required = ['profile']
 if (report.path.contains('restart')) required += backends.collect { 'restart_' + it }
 else {
  backends.each { backend ->
   ['deposit', 'restock', 'pickup', 'magnet', 'refill', 'feeding', 'alchemy', 'pump', 'crafting', 'access_contract'].each { upgrade ->
    required += backend + '_' + upgrade
    if (upgrade in ['deposit', 'restock', 'crafting']) required += backend + '_' + upgrade + '_placed'
    if (!(upgrade in ['deposit', 'restock', 'access_contract'])) required += backend + '_' + upgrade + '_backpack_first'
   }
  }
  if ('integrateddynamics' in backends) required += ['topology', 'binding', 'unavailable', 'items', 'channelsandlongcounts', 'nativefilters', 'fluidsandcachedguard', 'nativeinterceptors', 'cachedbackpackguard', 'serviceconservation', 'restockbatches', 'selectivequeries', 'positionfailurecleanup', 'feedingcontainerfallback'].collect { 'integrated_' + it }
 }
 if (names.toSet() != required.collect { 'digitalstorage_tests:' + it }.toSet()) throw new GradleException('Missing required GameTest scenarios: ' + required + '; got ' + names)
 return names.size()
}

['prepare', 'verify'].each { phase ->
 def suffix = phase.capitalize()
 def report = layout.buildDirectory.file('reports/restart/' + phase + '/gametest.xml')
 def logs = tasks.register('collectRestart' + suffix + 'Logs', Copy) {
  from project.file('../../../runs/26.1.2/restart/logs')
  into layout.buildDirectory.dir('reports/restart/' + phase + '/logs')
 }
 tasks.named('runRestart' + suffix) {
  finalizedBy logs
  doFirst {
   if (backendProfile != 'all') throw new GradleException('Restart tests require -PbackendProfile=all')
   report.get().asFile.parentFile.mkdirs()
   report.get().asFile.delete()
  }
  doLast { validateNativeReport(report.get().asFile) }
 }
}
tasks.named('runRestartVerify') { dependsOn 'runRestartPrepare' }
tasks.named('runRestartPrepare') { mustRunAfter 'runGameTestServer' }

def integrationLogs = tasks.register('collectIntegrationLogs', Copy) {
 from project.file('../../../runs/26.1.2/gametest-' + backendProfile + '/logs')
 into layout.buildDirectory.dir('reports/integration/' + backendProfile + '/logs')
}
tasks.named('runGameTestServer') {
 finalizedBy integrationLogs
 def report = layout.buildDirectory.file('reports/integration/' + backendProfile + '/gametest.xml')
 doFirst {
  report.get().asFile.parentFile.mkdirs()
  report.get().asFile.delete()
 }
 doLast {
  def discovered = validateNativeReport(report.get().asFile)
  def summary = layout.buildDirectory.file('reports/integration/' + backendProfile + '/summary.json').get().asFile
  summary.parentFile.mkdirs()
  summary.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([profile: backendProfile, requiredAddonTests: discovered, result: 'passed'])) + '\n'
 }
}

sourceSets.main.resources.srcDir('../../../shared/src/main/resources')

tasks.register('verifyIntegratedResources', Exec) {
 dependsOn tasks.named('jar')
 commandLine 'node', rootProject.file('../../tools/verify-jar.mjs').absolutePath,
  tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
  minecraft_version, 'neoforge', java_version.toString(), mod_id, mod_version
}
tasks.named('check') { dependsOn 'verifyIntegratedResources' }
